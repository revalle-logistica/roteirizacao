<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central de Demandas · Roteirização</title>
<style>body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#f4f6f9;color:#14202e;display:flex;align-items:center;justify-content:center;height:100vh}.l{text-align:center;color:#667385}.s{width:34px;height:34px;border:4px solid #dfe6f0;border-top-color:#0b3a6f;border-radius:50%;margin:0 auto 12px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="l" id="l"><div class="s"></div>Carregando a Central de Demandas…</div>
<script>
(function(){
const U="https://script.google.com/macros/s/AKfycbwWW1WUryd-xhOrZI6esjIuAB71Km_lg8wqtC5p6lpSRIOCRTKO6v4WTVqT6DLTXoOx/exec";
const RUN='async function run(fn, ...args){ let r; try{ r = await fetch(API_URL, {method:"POST", body:JSON.stringify({fn, args}), headers:{"Content-Type":"text/plain;charset=utf-8"}, credentials:"omit"}); }catch(e){ throw new Error("Sem conexão com o servidor"); } let j; try{ j = await r.json(); }catch(e){ throw new Error("Resposta inválida do servidor"); } if(!j.ok) throw new Error(j.error||"Erro"); return j.data; }';
fetch(U+"?raw=1",{credentials:"omit"}).then(r=>r.text()).then(h=>{
  h=h.replace('<base target="_top">','').replace(/const run = \(fn, \.\.\.args\) => new Promise\([^\n]*\n/, 'const API_URL="'+U+'";\n'+RUN+'\n');
  document.open(); document.write(h); document.close();
}).catch(()=>{ document.getElementById("l").textContent="Não foi possível carregar. Verifique a internet e atualize a página."; });
})();
</script>
</body>
</html>
